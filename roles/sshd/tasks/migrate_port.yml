---
- name: Wait for sshd on port {{ sshd_port }}
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: "{{ sshd_port | int }}"
    timeout: 60
  delegate_to: localhost
  become: false

# Not during bootstrap: the bootstrap user (root / cloud user) cannot log in any more.
- name: Reconnect on the new port
  when: not (preflight_bootstrap | default(false) | bool)
  block:
    - name: Use the new SSH port for the rest of this run
      ansible.builtin.set_fact:
        ansible_port: "{{ sshd_port | int }}" # noqa: var-naming[no-role-prefix]

    - name: Reset the SSH connection
      ansible.builtin.meta: reset_connection

- name: Remind to update the inventory
  ansible.builtin.debug:
    msg: >-
      SSH now listens on port {{ sshd_port }}. Set ansible_port: {{ sshd_port }} for
      {{ inventory_hostname }} in your inventory; the old port is closed on the next run.
