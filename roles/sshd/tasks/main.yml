---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install OpenSSH server
  ansible.builtin.package:
    name: "{{ __sshd_packages }}"
    state: present

- name: Ensure privilege separation directory exists
  ansible.builtin.file:
    path: "{{ __sshd_privsep_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Detect OpenSSH version
  ansible.builtin.command: ssh -V
  register: sshd_version_cmd
  changed_when: false
  check_mode: false

- name: Record OpenSSH version
  ansible.builtin.set_fact:
    sshd_openssh_version: "{{ sshd_version_cmd.stderr | regex_search('OpenSSH_(\\d+\\.\\d+)', '\\1') | first }}"

# Not "ssh-keygen -A": on OpenSSH < 9 it also creates the DSA key removed below.
- name: Generate missing host keys
  ansible.builtin.command:
    cmd: "ssh-keygen -q -t {{ item.type }} {{ item.opts }} -N '' -f /etc/ssh/ssh_host_{{ item.type }}_key"
    creates: "/etc/ssh/ssh_host_{{ item.type }}_key"
  loop:
    - { type: ed25519, opts: "" }
    - { type: ecdsa, opts: "-b 521" }
    - { type: rsa, opts: "-b 4096" }
  loop_control:
    label: "{{ item.type }}"
  notify: Restart sshd

- name: Remove DSA host keys
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/ssh_host_dsa_key
    - /etc/ssh/ssh_host_dsa_key.pub
  notify: Restart sshd

- name: Find weak Diffie-Hellman moduli
  ansible.builtin.command: awk '$1 !~ /^#/ && $5 < {{ sshd_moduli_min_size }}' /etc/ssh/moduli
  register: sshd_weak_moduli
  changed_when: false
  check_mode: false

- name: Remove weak Diffie-Hellman moduli
  ansible.builtin.shell: >-
    awk '$1 ~ /^#/ || $5 >= {{ sshd_moduli_min_size }}' /etc/ssh/moduli > /etc/ssh/moduli.tmp
    && mv /etc/ssh/moduli.tmp /etc/ssh/moduli
  changed_when: true
  when: sshd_weak_moduli.stdout | length > 0
  notify: Restart sshd

- name: Allow the SSH port in SELinux
  community.general.seport:
    ports: "{{ sshd_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
    - sshd_port | int != 22

- name: Switch from socket activation to ssh.service
  ansible.builtin.include_tasks: socket_activation.yml
  when:
    - sshd_disable_socket_activation | bool
    - ansible_facts['os_family'] == 'Debian'

- name: Create sshd drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make sure sshd_config reads the drop-in directory first
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^Include\\s+/etc/ssh/sshd_config\\.d/\\*\\.conf"
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

# Port is additive in sshd (every Port line is bound), so the drop-in must be the only one.
- name: Disable Port lines in the main sshd_config
  ansible.builtin.replace:
    path: /etc/ssh/sshd_config
    regexp: "^(Port\\s+.*)$"
    replace: "# \\1  # managed in sshd_config.d/00-hardening.conf"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Deploy login banner
  ansible.builtin.copy:
    dest: /etc/ssh/banner
    content: "{{ sshd_banner }}"
    owner: root
    group: root
    mode: "0644"
  when: sshd_banner_enabled | bool

- name: Deploy hardened sshd drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Enable sshd
  ansible.builtin.systemd_service:
    name: "{{ __sshd_service }}"
    enabled: true
    state: started

- name: Apply SSH changes now
  ansible.builtin.meta: flush_handlers

- name: Move the Ansible connection to the new SSH port
  ansible.builtin.include_tasks: migrate_port.yml
  when:
    - ansible_connection | default('ssh') in ['ssh', 'smart', 'paramiko', 'ansible.builtin.ssh', 'ansible.legacy.ssh']
    - (ansible_port | default(22) | int) != (sshd_port | int)
