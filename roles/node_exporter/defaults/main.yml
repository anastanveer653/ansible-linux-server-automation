---
node_exporter_version: "1.9.1"
node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"

# Keep this reachable only by Prometheus: open it with a source-restricted firewall_rules entry.
node_exporter_listen_address: "0.0.0.0:9100"

node_exporter_collectors_enabled: [systemd, processes]
node_exporter_collectors_disabled: []
node_exporter_textfile_dir: /var/lib/node_exporter/textfile

node_exporter_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv7
  ppc64le: ppc64le
  s390x: s390x
