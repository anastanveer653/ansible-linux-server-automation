---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Require a password hash when sudo asks for a password
  ansible.builtin.assert:
    that: users_admin_passwordless_sudo | bool or users_admin_password_hash | length > 0
    fail_msg: >-
      users_admin_passwordless_sudo is false but users_admin_password_hash is empty:
      the key-only admin user could never complete a sudo prompt.
    quiet: true

- name: Create admin user
  ansible.builtin.user:
    name: "{{ users_admin_name }}"
    groups: "{{ users_admin_groups }}"
    append: true
    shell: "{{ users_admin_shell }}"
    create_home: true
    password: "{{ users_admin_password_hash | default(omit, true) }}"
    update_password: always
    state: present

- name: Install admin SSH keys
  ansible.posix.authorized_key:
    user: "{{ users_admin_name }}"
    key: "{{ users_admin_authorized_keys | join('\n') }}"
    exclusive: "{{ users_admin_authorized_keys_exclusive }}"
    state: present
  when: users_admin_authorized_keys | length > 0

- name: Configure admin sudo rule
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ users_admin_name }}"
    content: |
      # Managed by Ansible
      {{ users_admin_name }} ALL=(ALL:ALL) {{ 'NOPASSWD: ' if users_admin_passwordless_sudo | bool else '' }}ALL
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Manage additional users
  ansible.builtin.include_tasks: managed_user.yml
  loop: "{{ users_managed }}"
  loop_control:
    loop_var: users_item
    label: "{{ users_item.name }}"

- name: Lock root password
  ansible.builtin.user:
    name: root
    password_lock: true
  when: users_lock_root_password | bool
