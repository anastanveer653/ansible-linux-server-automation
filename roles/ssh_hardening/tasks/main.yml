---
# ══════════════════════════════════════════════
# Role: ssh_hardening
# CIS Benchmark aligned SSH configuration
# ══════════════════════════════════════════════

- name: Backup original sshd_config
  ansible.builtin.copy:
    src: /etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config.bak
    remote_src: true
    force: false
    mode: "0600"

- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart SSH

- name: Remove weak SSH host keys (DSA)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/ssh_host_dsa_key
    - /etc/ssh/ssh_host_dsa_key.pub
  notify: Restart SSH

- name: Regenerate ED25519 host key if missing
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key -N ""
    creates: /etc/ssh/ssh_host_ed25519_key
  notify: Restart SSH

- name: Set correct permissions on SSH host keys
  ansible.builtin.file:
    path: /etc/ssh/ssh_host_ed25519_key
    mode: "0600"
    owner: root
    group: root

- name: Ensure SSH is enabled and started
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: started
    enabled: true

- name: Configure SSH banner
  ansible.builtin.copy:
    content: |
      ╔══════════════════════════════════════════════╗
      ║         AUTHORIZED ACCESS ONLY               ║
      ║  All activity is monitored and logged.       ║
      ║  Unauthorized access will be prosecuted.     ║
      ╚══════════════════════════════════════════════╝
    dest: /etc/ssh/banner
    mode: "0644"
