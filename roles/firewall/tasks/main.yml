---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install nftables
  ansible.builtin.package:
    name: nftables
    state: present

- name: Create nftables include directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy firewall ruleset
  ansible.builtin.template:
    src: hardening.nft.j2
    dest: /etc/nftables.d/50-hardening.nft
    owner: root
    group: root
    mode: "0600"
    validate: nft -c -f %s
  notify: Load firewall ruleset

- name: Load the ruleset at boot
  ansible.builtin.lineinfile:
    path: "{{ __firewall_main_conf }}"
    line: 'include "/etc/nftables.d/*.nft"'
    create: false

# Enable only: starting nftables.service on Debian runs "flush ruleset" and would
# wipe tables owned by Docker or fail2ban. The ruleset is loaded with nft -f instead.
- name: Enable nftables at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

- name: Check whether the ruleset is loaded
  ansible.builtin.command: nft list table inet hardening
  register: firewall_table
  changed_when: false
  failed_when: false
  check_mode: false

- name: Load the ruleset if it is missing
  ansible.builtin.command: nft -f /etc/nftables.d/50-hardening.nft
  changed_when: true
  when: firewall_table.rc != 0

# The SSH role may move the port in this run; the new rules must be live first.
- name: Apply firewall changes now
  ansible.builtin.meta: flush_handlers

# Package facts, not service facts: other units (e.g. fail2ban's After=firewalld.service)
# make systemd list firewalld as a "not-found" unit even when it is not installed.
- name: Gather installed packages
  ansible.builtin.package_facts:
  when: firewall_disable_conflicting | bool

- name: Stop conflicting firewall managers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ __firewall_conflicting_services }}"
  when:
    - firewall_disable_conflicting | bool
    - item in ansible_facts['packages']
