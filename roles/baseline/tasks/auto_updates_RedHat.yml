---
- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: Configure dnf-automatic to apply security updates
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { option: upgrade_type, value: security }
    - { option: apply_updates, value: "yes" }
    - { option: reboot, value: "{{ 'when-needed' if baseline_auto_updates_reboot | bool else 'never' }}" }
  loop_control:
    label: "{{ item.option }}"

- name: Enable dnf-automatic timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    enabled: true
    state: started
