---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Enable EPEL repository
  ansible.builtin.include_tasks: epel.yml
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - baseline_enable_epel | bool

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Install baseline packages
  ansible.builtin.package:
    name: "{{ baseline_packages + baseline_packages_extra }}"
    state: present

- name: Remove insecure legacy packages
  ansible.builtin.package:
    name: "{{ baseline_packages_absent }}"
    state: absent

- name: Configure timezone and locale
  ansible.builtin.import_tasks: locale.yml

- name: Configure automatic security updates
  ansible.builtin.include_tasks: "auto_updates_{{ ansible_facts['os_family'] }}.yml"
  when: baseline_auto_updates | bool

- name: Apply kernel and system hardening
  ansible.builtin.import_tasks: hardening.yml

- name: Configure auditd
  ansible.builtin.import_tasks: auditd.yml
  when: baseline_auditd | bool

- name: Write managed-host marker
  ansible.builtin.copy:
    dest: /etc/ansible-managed
    content: |
      This host is managed by Ansible. Manual changes to managed files will be overwritten.
      Source: {{ baseline_marker_repo }}
    owner: root
    group: root
    mode: "0644"
