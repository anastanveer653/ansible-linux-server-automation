---
- name: Install epel-release (Rocky / AlmaLinux / CentOS Stream)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['distribution'] != 'RedHat'

- name: Install EPEL on RHEL
  when: ansible_facts['distribution'] == 'RedHat'
  block:
    - name: Import EPEL signing key
      ansible.builtin.rpm_key:
        key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"
        state: present

    - name: Install epel-release package
      ansible.builtin.dnf:
        name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
