---
- name: Apply sysctl settings
  ansible.builtin.command: sysctl -e -p /etc/sysctl.d/90-hardening.conf
  changed_when: true
  when: baseline_sysctl_apply | bool

# auditd refuses "systemctl restart" on EL; augenrules works everywhere.
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: not baseline_in_container
