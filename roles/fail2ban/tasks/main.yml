---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install fail2ban
  ansible.builtin.package:
    name: "{{ __fail2ban_packages }}"
    state: present

- name: Configure fail2ban daemon
  ansible.builtin.copy:
    dest: /etc/fail2ban/fail2ban.local
    content: |
      # Managed by Ansible
      [Definition]
      # recidive reads this file, so log to disk on every distro.
      logtarget = /var/log/fail2ban.log
      dbpurgeage = 8d
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Make sure the fail2ban log exists for the recidive jail
  ansible.builtin.file:
    path: /var/log/fail2ban.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    access_time: preserve
    modification_time: preserve

- name: Configure jails
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

- name: Apply fail2ban changes now
  ansible.builtin.meta: flush_handlers

- name: Check sshd jail is active
  ansible.builtin.command: fail2ban-client status sshd
  register: fail2ban_sshd_status
  changed_when: false
  retries: 5
  delay: 2
  until: fail2ban_sshd_status.rc == 0
