---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Gather installed packages
  ansible.builtin.package_facts:

# Match real package names only: containerd.io "provides" runc/containerd, and
# removing those names by provide would uninstall Docker on the next run.
- name: Remove conflicting container packages
  ansible.builtin.package:
    name: "{{ __docker_conflicting_packages | select('in', ansible_facts['packages']) | list }}"
    state: absent
  when: __docker_conflicting_packages | select('in', ansible_facts['packages']) | list | length > 0

- name: Configure Docker repository
  ansible.builtin.include_tasks: "repo_{{ ansible_facts['os_family'] }}.yml"

- name: Install Docker Engine
  ansible.builtin.package:
    name: "{{ docker_packages }}"
    state: present

- name: Create Docker config directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json(indent=2) }}\n"
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file=%s
  vars:
    docker_daemon_config: >-
      {{ docker_daemon_defaults
         | combine({'ip': '127.0.0.1'} if docker_publish_localhost_only | bool else {})
         | combine(docker_daemon_options, recursive=true) }}
  notify: Restart docker

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Apply Docker changes now
  ansible.builtin.meta: flush_handlers

- name: Check Docker daemon is responding
  ansible.builtin.command: docker info --format '{{ "{{" }}.ServerVersion{{ "}}" }}'
  register: docker_info
  changed_when: false
