---
- name: Install deb822 repository support
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ docker_arch_map[ansible_facts['architecture']] }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
  register: docker_apt_repo

- name: Refresh apt cache # noqa: no-handler - the install task right after needs the new index
  ansible.builtin.apt:
    update_cache: true
  when: docker_apt_repo is changed
