---
- name: Add Docker dnf repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: "https://download.docker.com/linux/{{ docker_rpm_flavor }}/$releasever/$basearch/stable"
    gpgkey: "https://download.docker.com/linux/{{ docker_rpm_flavor }}/gpg"
    gpgcheck: true
    enabled: true
  vars:
    docker_rpm_flavor: "{{ 'rhel' if ansible_facts['distribution'] == 'RedHat' else 'centos' }}"
