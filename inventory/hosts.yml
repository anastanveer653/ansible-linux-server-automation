# ══════════════════════════════════════════════
# Inventory — hosts.yml
# Replace IPs with your actual server IPs
# ══════════════════════════════════════════════

all:
  children:

    # ── Web / App Servers ──────────────────────
    webservers:
      hosts:
        web01:
          ansible_host: 192.168.1.10
          ansible_user: ubuntu
        web02:
          ansible_host: 192.168.1.11
          ansible_user: ubuntu

    # ── Database Servers ───────────────────────
    dbservers:
      hosts:
        db01:
          ansible_host: 192.168.1.20
          ansible_user: ubuntu

    # ── Monitoring Servers ─────────────────────
    monitoring:
      hosts:
        mon01:
          ansible_host: 192.168.1.30
          ansible_user: ubuntu
          install_monitoring: true

    # ── Docker Hosts ───────────────────────────
    docker_hosts:
      hosts:
        docker01:
          ansible_host: 192.168.1.40
          ansible_user: ubuntu
          install_docker: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
