---
# Settings shared by every host. Each role documents all of its options in
# roles/<role>/defaults/main.yml; only the ones you are likely to change are here.

# ── Admin access ───────────────────────────────────────────────────────────────
users_admin_name: sysadmin
users_admin_authorized_keys: []
#  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... you@laptop"

# ── SSH ────────────────────────────────────────────────────────────────────────
sshd_port: 22
sshd_allow_users: ["{{ users_admin_name }}"]

# ── Firewall ───────────────────────────────────────────────────────────────────
firewall_allowed_tcp_ports: [80, 443]
firewall_rules:
  - port: 9100
    proto: tcp
    sources: ["10.0.0.0/8"]           # your Prometheus server(s)
    comment: node_exporter
    enabled: "{{ install_monitoring }}"

# ── System ─────────────────────────────────────────────────────────────────────
baseline_timezone: UTC
baseline_auto_updates_reboot: false

# ── Optional services ─────────────────────────────────────────────────────────
install_docker: false
install_monitoring: false

# Secrets (e.g. users_admin_password_hash) belong in an encrypted file:
#   ansible-vault create inventory/group_vars/all/vault.yml
