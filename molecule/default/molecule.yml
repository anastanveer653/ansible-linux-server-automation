---
# Runs site.yml against a systemd container, checks idempotence, then verifies state.
#   make test DISTRO=rockylinux9      (sets MOLECULE_DISTRO and MOLECULE_IMAGE)
driver:
  name: docker

platforms:
  - name: instance-${MOLECULE_DISTRO:-ubuntu2404}
    image: ${MOLECULE_IMAGE:-docker.io/geerlingguy/docker-ubuntu2404-ansible:latest}
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Docker-in-Docker cannot stack overlayfs on the container's own overlay root.
      - /var/lib/docker
      - /var/lib/containerd
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # The docker connection is already root; sudo root->root fails PAM account
        # checks in RHEL containers on GitHub runners. Real hosts still use sudo.
        ansible_become: false
        users_admin_name: sysadmin
        users_admin_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGR4y9bTLPvxxrHStofi6pV3SksEUYCW2Lu7/rsoeDQw molecule@ci
        users_managed:
          - name: deploy
            sudo: false
            authorized_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGR4y9bTLPvxxrHStofi6pV3SksEUYCW2Lu7/rsoeDQw molecule@ci
        # Exercise the non-default code paths.
        sshd_port: 2222
        baseline_timezone: Asia/Karachi
        firewall_allowed_tcp_ports: [80, 443]
        firewall_rules:
          - port: 9100
            sources: ["10.0.0.0/8", "fd00::/8"]
            comment: node_exporter
        install_docker: true
        docker_users: [sysadmin]
        install_monitoring: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
