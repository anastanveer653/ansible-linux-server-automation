---
# Installs node_exporter and re-renders the firewall so the source-restricted
# port 9100 rule in group_vars (firewall_rules) becomes active.
#   ansible-playbook playbooks/setup-monitoring.yml

- name: Install Prometheus node_exporter
  hosts: all
  become: true
  gather_facts: true

  vars:
    install_monitoring: true

  roles:
    - role: preflight
    - role: firewall
    - role: node_exporter
