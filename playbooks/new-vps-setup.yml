---
# ══════════════════════════════════════════════════════════════
# Playbook: new-vps-setup.yml
# One-command fresh VPS bootstrap
# Usage: ansible-playbook playbooks/new-vps-setup.yml -i "YOUR_IP," -u root
# ══════════════════════════════════════════════════════════════

- name: Bootstrap a fresh VPS from root
  hosts: all
  become: true

  vars:
    # Override defaults for fresh-server setup
    ssh_password_authentication: "yes"  # Temporarily allow until key is added

  pre_tasks:
    - name: Display target server info
      ansible.builtin.debug:
        msg:
          - "Bootstrapping: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

  roles:
    - role: baseline
    - role: users
    - role: ssh_hardening
    - role: firewall
    - role: fail2ban

  post_tasks:
    - name: VPS setup complete
      ansible.builtin.debug:
        msg:
          - "✅ VPS is ready!"
          - "   SSH in with: ssh {{ admin_user }}@{{ ansible_host }} -p {{ ssh_port }}"
          - "   Root login is now DISABLED."
          - "   Firewall is ACTIVE."
          - "   Fail2Ban is RUNNING."
