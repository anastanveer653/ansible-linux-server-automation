---
# First run on a fresh server, connecting as root (or the cloud image user, e.g. ubuntu).
# After this run only users_admin_name can log in, so switch ansible_user to it.
#
#   ansible-playbook playbooks/new-vps-setup.yml -l web01 -e ansible_user=root

- name: Bootstrap a fresh server
  hosts: all
  become: true
  gather_facts: true

  vars:
    preflight_bootstrap: true

  # sshd goes last: once it restarts, the bootstrap user can no longer open new connections.
  roles:
    - role: preflight
    - role: baseline
    - role: users
    - role: firewall
    - role: fail2ban
    - role: sshd

  post_tasks:
    - name: Next steps
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} is hardened."
          - "Log in with: ssh -p {{ sshd_port }} {{ users_admin_name }}@{{ ansible_host | default(inventory_hostname) }}"
          - "Set ansible_user: {{ users_admin_name }} and ansible_port: {{ sshd_port }} for this host in your inventory."
          - "Root and password logins are disabled from now on."
