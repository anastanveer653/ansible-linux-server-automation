---
# Re-apply the security roles only (no package baseline, no optional services).
#   ansible-playbook playbooks/security-hardening.yml

- name: Security hardening
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: preflight
      tags: [always]
    - role: firewall
      tags: [firewall]
    - role: sshd
      tags: [ssh]
    - role: fail2ban
      tags: [fail2ban]
