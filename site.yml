---
# Full baseline + hardening for every host in the inventory.
#   ansible-playbook site.yml                        # everything
#   ansible-playbook site.yml --tags ssh,firewall    # a subset
#   ansible-playbook site.yml --check --diff         # dry run

- name: Harden Linux servers
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: preflight
      tags: [always]

    - role: baseline
      tags: [baseline]

    - role: users
      tags: [users]

    # firewall before sshd: a new SSH port must be open before sshd moves to it
    - role: firewall
      tags: [firewall, security]

    - role: sshd
      tags: [ssh, security]

    - role: fail2ban
      tags: [fail2ban, security]

    - role: docker
      tags: [docker]
      when: install_docker | default(false) | bool

    - role: node_exporter
      tags: [monitoring]
      when: install_monitoring | default(false) | bool

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }}: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          - "SSH      : port {{ sshd_port }}, users {{ sshd_allow_users | join(', ') }}, root login {{ sshd_permit_root_login }}"
          - "Firewall : nftables, open tcp {{ (firewall_ssh_ports + firewall_allowed_tcp_ports) | join(', ') }}"
          - "Docker   : {{ 'installed' if install_docker | default(false) | bool else 'skipped' }}"
          - "Metrics  : {{ node_exporter_listen_address if install_monitoring | default(false) | bool else 'skipped' }}"
      tags: [always]
