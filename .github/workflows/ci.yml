---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly, catches upstream package/image changes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: |
          cp inventory/hosts.example.yml inventory/hosts.yml
          for playbook in site.yml playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook"
          done

  molecule:
    name: Molecule (${{ matrix.distro }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu2204, image: "docker.io/geerlingguy/docker-ubuntu2204-ansible:latest" }
          - { distro: ubuntu2404, image: "docker.io/geerlingguy/docker-ubuntu2404-ansible:latest" }
          - { distro: debian12, image: "docker.io/geerlingguy/docker-debian12-ansible:latest" }
          - { distro: debian13, image: "docker.io/geerlingguy/docker-debian13-ansible:latest" }
          - { distro: rockylinux9, image: "docker.io/geerlingguy/docker-rockylinux9-ansible:latest" }
          - { distro: centos9, image: "localhost/molecule-centos9:latest", dockerfile: molecule/images/centos9.Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install community.docker  # used by the Molecule docker driver

      - name: Build test image
        if: matrix.dockerfile
        run: docker build -t "${{ matrix.image }}" -f "${{ matrix.dockerfile }}" molecule/images

      - name: Converge, idempotence, verify
        run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          MOLECULE_IMAGE: ${{ matrix.image }}
